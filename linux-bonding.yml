---
- name: Deploy Enterprise Network Bonding Based on 1U/2U Chassis Factor
  hosts: all
  become: yes
  gather_facts: yes

  vars:
    # -------------------------------------------------------------------------
    # 1U Server Profile (2 Pairs, 4 Ports using 2-Port NICs x 2)
    # -------------------------------------------------------------------------
    profile_1U:
      - name: "bond0"
        mode: "active-backup"
        mtu: 1500
        slaves: ["p1p0", "p2p0"]
        ip: "10.10.10.50/24"
        gw: "10.10.10.1"
      - name: "bond1"
        mode: "802.3ad"
        mtu: 9000
        slaves: ["p1p1", "p2p1"]
        ip: "10.20.20.50/24"

    # -------------------------------------------------------------------------
    # 2U Full-Spec Server Profile (4 Pairs, 8 Ports using 2-Port NICs x 4)
    # Balanced cross-mapping via symmetric slots (Slot 1-4, Slot 2-5)
    # -------------------------------------------------------------------------
    profile_2U:
      # Service Network: Active on Slot 1, Standby on Slot 4
      - name: "bond0"
        mode: "active-backup"
        mtu: 1500
        slaves: ["p1p0", "p4p0"]
        ip: "10.10.10.50/24"
        gw: "10.10.10.1"

      # Backup/Storage Network: LACP with Jumbo Frames on Slot 1-4 (Port 1)
      - name: "bond1"
        mode: "802.3ad"
        mtu: 9000
        slaves: ["p1p1", "p4p1"]
        ip: "10.20.20.50/24"

      # Oracle RAC Interconnect: LACP with Jumbo Frames on Slot 2-5 (Port 0)
      - name: "bond2"
        mode: "802.3ad"
        mtu: 9000
        slaves: ["p2p0", "p5p0"]
        ip: "10.30.30.50/24"

      # Active Data Guard (DR): Active on Slot 2, Standby on Slot 5 (Port 1)
      - name: "bond3"
        mode: "active-backup"
        mtu: 1500
        slaves: ["p2p1", "p5p1"]
        ip: "10.40.40.50/24"

  tasks:
    # -------------------------------------------------------------------------
    # FACT GATHERING & PROFILE SELECTION
    # -------------------------------------------------------------------------
    - name: Detect server chassis model and dynamically assign network profile
      set_fact:
        target_profile: "{{ profile_2U if ('DL380' in ansible_product_name or 'R760' in ansible_product_name or 'SR650' in ansible_product_name) else profile_1U }}"

    - name: Display detected system form factor and total target bonding pairs
      debug:
        msg: "Target System: {{ ansible_product_name }} -> Allocating {{ target_profile | length }} Bonded Pairs."

    # -------------------------------------------------------------------------
    # NETWORK CLEANUP & INITIALIZATION
    # -------------------------------------------------------------------------
    - name: Purge any existing standalone connection profiles for target physical NICs
      nmcli:
        conn_name: "{{ item }}"
        state: absent
      loop: "{{ target_profile | map(attribute='slaves') | flatten }}"

    # -------------------------------------------------------------------------
    # MASTER BOND INTERFACE CONFIGURATION
    # -------------------------------------------------------------------------
    - name: Initialize master bonding interfaces and allocate logical IP addresses
      nmcli:
        conn_name: "{{ item.name }}"
        ifname: "{{ item.name }}"
        type: bond
        mode: "{{ item.mode }}"
        ip4: "{{ item.ip }}"
        gw4: "{{ item.gw | default(omit) }}"
        state: present
      loop: "{{ target_profile }}"

    - name: Apply link aggregation performance tuning (MTU size & MII monitoring interval)
      shell: |
        nmcli connection modify "{{ item.name }}" 802-3-ethernet.mtu {{ item.mtu }} bond.options "miimon=100"
      loop: "{{ target_profile }}"

    # -------------------------------------------------------------------------
    # SLAVE INTERFACE BINDING & MTU SYNCHRONIZATION
    # -------------------------------------------------------------------------
    - name: Bind physical slave ports to their respective master bonding interfaces
      nmcli:
        conn_name: "{{ item.0.name }}-{{ item.1 }}"
        ifname: "{{ item.1 }}"
        type: bond-slave
        master: "{{ item.0.name }}"
        state: present
      loop: "{{ target_profile | subelements('slaves') }}"

    - name: Enforce MTU synchronization down to physical NIC connection layer
      shell: |
        nmcli connection modify "{{ item.0.name }}-{{ item.1 }}" 802-3-ethernet.mtu {{ item.0.mtu }}
      loop: "{{ target_profile | subelements('slaves') }}"

    # -------------------------------------------------------------------------
    # NETWORK SERVICE ACTIVATION
    # -------------------------------------------------------------------------
    - name: Commit and re-activate entire network infrastructure configuration
      shell: "nmcli connection down {{ item.name }} && nmcli connection up {{ item.name }}"
      loop: "{{ target_profile }}"
